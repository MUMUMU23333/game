name: 👑 量化策略早盘 09:26 集合竞价决策与实操雷达总线 (Master 早盘总线)

on:
  # 提前错峰充分预热：每个交易日北京时间 09:10 (UTC 01:10) 唤醒 Runner (预留 16 分钟排队裕度)
  schedule:
    - cron: '10 1 * * 1-5'

  # 支持在 GitHub 网页上一键手动点击触发
  workflow_dispatch:
    inputs:
      skip_wait:
        description: '是否跳过等待立即全量执行 (true/false)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  run-morning-master-pipeline:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Shanghai'

    steps:
      - name: 检出量化策略仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 安装量化核心计算与推送依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------------------------------------------------
      # 🛑 前置交易日休市熔断守卫：非交易日自动优雅退出，不执行后续任何计算与推送
      # ----------------------------------------------------------------------
      - name: 🛑 A股交易日休市熔断检测 (周末/法定节假日优雅阻断)
        if: "${{ github.event_name == 'schedule' || !inputs.skip_wait }}"
        run: |
          python trade_day_guard.py --assert-trade-day

      # ----------------------------------------------------------------------
      # ⏳ 毫秒级准点对齐至北京时间 09:26:00 (集合竞价撮合完毕，留足4分钟决策时间)
      # ----------------------------------------------------------------------
      - name: ⏳ 毫秒级对齐至早盘 09:26:00 (超时自动硬阻断退出 88)
        run: |
          if [ "${{ github.event_name == 'schedule' || !inputs.skip_wait }}" = "true" ]; then
            python precision_scheduler.py --target 09:26:00
          fi

      # ----------------------------------------------------------------------
      # 阶段 1: 09:26 准点触发【终极神王体 · 苍穹七十矛主板种业神皇版】早盘决策雷达
      # ----------------------------------------------------------------------
      - name: 🚀 [阶段 1] 执行 终极神王体 89矛顶峰天王版 早盘决策速查
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          GODKING_WEBHOOK: ${{ secrets.GODKING_WEBHOOK }}
        run: |
          python godking_ultimate_notifier.py --morning --push

      # ----------------------------------------------------------------------
      # 阶段 2: 09:26 准点触发【科创-银行轮动ETF策略 (V5.9 Apex-Master)】开盘态势速查
      # ----------------------------------------------------------------------
      - name: 🚀 [阶段 2] 执行 科创-银行轮动ETF策略 早盘开盘态势速查
        env:
          CHINEXT_BANK_WEBHOOK: ${{ secrets.CHINEXT_BANK_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          python chinext_bank_strategy_notifier.py --push

      # ----------------------------------------------------------------------
      # 阶段 3: 09:29:00 看门狗哨兵健康巡检与自愈兜底
      # ----------------------------------------------------------------------
      - name: 🐕 [阶段 3] 早盘看门狗健康巡检 (Dead Man's Switch Watchdog)
        run: |
          python morning_watchdog_sentinel.py || echo "Watchdog completed with warnings"

      # ----------------------------------------------------------------------
      # 阶段 4: 原子化持久化同步状态与缓存
      # ----------------------------------------------------------------------
      - name: 💾 原子化同步并持久化早盘状态与推送缓存
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .godking_ultimate_morning_cache.json .chinext_bank_push_cache.json || true
          git commit -m "chore(morning): auto sync morning 09:26 states and watchdog logs [skip ci]" || echo "无状态变更"
          git push || echo "Git push skipped"
