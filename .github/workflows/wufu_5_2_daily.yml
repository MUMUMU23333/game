name: 五福 5.2 策略每日 13:10 & 14:55 自动推送

on:
  # 仅保留午盘 13:00 预热 ➔ 13:10 午盘扫描 (尾盘 14:55 由 Master 总线统一调度)
  schedule:
    - cron: '0 5 * * 1-5'
  workflow_dispatch:
    inputs:
      skip_wait:
        description: '是否跳过等待立即执行 (true/false)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  run-wufu-5-2:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装量化计算依赖
        run: |
          pip install requests numpy pandas schedule

      - name: ⏳ 毫秒级准点对齐 (智能判定 13:10 或 14:55)
        if: "${{ github.event_name == 'schedule' || !inputs.skip_wait }}"
        run: |
          python -c "
          from precision_scheduler import wait_until_target_beijing_time, get_beijing_now
          now = get_beijing_now()
          if now.hour < 14:
              wait_until_target_beijing_time(13, 10)
          else:
              wait_until_target_beijing_time(14, 55)
          "

      - name: 执行五福 5.2 策略计算与企业微信推送
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          cd quant_strategies/wufu_5_2
          python wufu_5_2_local_bot.py --force

      - name: 自动同步并持久化持仓状态
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add quant_strategies/wufu_5_2/portfolio_state.json || true
          git commit -m "chore: auto update wufu 5.2 state [skip ci]" || true
          git push || true
