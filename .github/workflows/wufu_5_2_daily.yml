name: 五福 5.2 策略每日 13:10 自动推送

on:
  # 每个交易日北京时间 13:10 (UTC 05:10) 自动触发
  schedule:
    - cron: '10 5 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-wufu-5-2:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装量化计算依赖
        run: |
          pip install requests numpy pandas schedule

      - name: 执行五福 5.2 策略计算与企业微信推送
        run: |
          cd quant_strategies/wufu_5_2
          python wufu_5_2_local_bot.py

      - name: 自动同步并持久化持仓状态
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add quant_strategies/wufu_5_2/portfolio_state.json || true
          git commit -m "chore: auto update wufu 5.2 state [skip ci]" || true
          git push || true
