name: 七星量化策略每日 14:47 自动推送

on:
  # 每个交易日北京时间 14:47 (UTC 06:47) 准时自动运行
  schedule:
    - cron: '47 6 * * 1-5'
  # 支持在 GitHub 网页上手动点击立即运行测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-seven-stars:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装量化科学计算依赖
        run: |
          pip install requests numpy pandas schedule

      - name: 执行七星量化策略计算与企业微信推送
        run: |
          cd "七星策略"
          python local_etf_quant_bot.py --now

      - name: 自动同步并持久化持仓状态
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "七星策略/portfolio_state.json" || true
          git commit -m "chore: auto update seven stars state [skip ci]" || true
          git push || true
