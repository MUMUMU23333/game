name: 七星量化策略每日 14:47 自动推送与双策略收盘汇总

on:
  # 定时由 quant_master_daily_pipeline.yml 总线统一调度，本文件仅保留手动触发
  # schedule:
  #   - cron: '25 6 * * 1-5'
  workflow_dispatch:
    inputs:
      skip_wait:
        description: '是否跳过等待立即执行 (true/false)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  run-seven-stars-and-summary:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装量化计算依赖
        run: |
          pip install requests numpy pandas schedule

      - name: ⏳ 毫秒级准点对齐 (等待至北京时间 14:47:00)
        if: "${{ github.event_name == 'schedule' || !inputs.skip_wait }}"
        run: |
          python precision_scheduler.py --target 14:47

      - name: 执行七星量化策略计算与企业微信推送
        run: |
          cd quant_strategies/seven_stars
          python local_etf_quant_bot.py --now

      - name: 自动同步并持久化持仓状态
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add quant_strategies/seven_stars/portfolio_state.json || true
          git commit -m "chore: auto update seven stars state [skip ci]" || true
          git push || true
