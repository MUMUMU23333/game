name: 👑 纳指-双核银行全球策略 (稳健财富旗舰版) · 每日实盘监控与全渠道提醒

on:
  # 定时由 quant_master_daily_pipeline.yml 总线统一调度，本文件仅保留手动触发
  # schedule:
  #   - cron: '20 6 * * 1-5'
  #   - cron: '50 12 * * 1-5'
  
  # 支持在 GitHub 网页上一键手动点击运行测试
  workflow_dispatch:
    inputs:
      skip_wait:
        description: '是否跳过等待立即执行 (true/false)'
        required: false
        default: 'false'
        type: boolean

jobs:
  run-daily-monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出策略代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境 (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 安装量化核心依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⏳ 毫秒级准点对齐 (尾盘 14:45 或 晚间 21:00)
        if: "${{ github.event_name == 'schedule' || !inputs.skip_wait }}"
        run: |
          python -c "
          from precision_scheduler import wait_until_target_beijing_time, get_beijing_now
          now = get_beijing_now()
          if now.hour < 18:
              wait_until_target_beijing_time(14, 45)
          else:
              wait_until_target_beijing_time(21, 0)
          "

      - name: 运行 DTB 4.0 实时信号引擎并全渠道推送提醒
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python national_team_tracker/daily_dtb_monitor.py
