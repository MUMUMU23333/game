name: 👑 终极神王体 · 苍穹七十矛主板种业神皇版 (70矛) · 早盘 09:26 开盘态势与实操决策雷达

on:
  # 提前错峰预热启动：每个交易日北京时间 09:15 (UTC 01:15) 启动 GitHub Actions Runner
  schedule:
    - cron: '15 1 * * 1-5'

  # 支持在 GitHub 网页上一键手动点击触发
  workflow_dispatch:
    inputs:
      skip_wait:
        description: '是否跳过等待立即执行 (true/false)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  run-morning-radar:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Shanghai'

    steps:
      - name: 检出量化策略仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 安装量化核心计算与推送依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------------------------------------------------
      # 🛑 前置交易日休市熔断守卫：非交易日自动优雅退出，不执行后续任何计算与推送
      # ----------------------------------------------------------------------
      - name: 🛑 A股交易日休市熔断检测 (周末/法定节假日优雅阻断)
        if: "${{ github.event_name == 'schedule' || !inputs.skip_wait }}"
        run: |
          python trade_day_guard.py --assert-trade-day

      # ----------------------------------------------------------------------
      # ⏳ 毫秒级准点对齐至北京时间 09:26:00 (集合竞价撮合完毕，留足4分钟决策时间)
      # ----------------------------------------------------------------------
      - name: ⏳ 毫秒级对齐至早盘 09:26:00
        run: |
          if [ "${{ github.event_name == 'schedule' || !inputs.skip_wait }}" = "true" ]; then
            python precision_scheduler.py --target 09:26:00
          fi

      # ----------------------------------------------------------------------
      # 🚀 运行【终极神王体 · 70矛主板种业神皇版】早盘决策雷达并推送企业微信
      # ----------------------------------------------------------------------
      - name: 🚀 执行早盘 09:26 态势速查并推送企业微信
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          GODKING_WEBHOOK: ${{ secrets.GODKING_WEBHOOK }}
        run: |
          python godking_ultimate_notifier.py --morning --push

      # ----------------------------------------------------------------------
      # 💾 原子化同步并持久化早盘状态与去重缓存 (防 Git 冲突)
      # ----------------------------------------------------------------------
      - name: 💾 原子化同步并持久化早盘状态与推送缓存
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .godking_ultimate_state.json .godking_ultimate_cache.json || true
          git commit -m "chore(godking): auto sync morning 09:26 portfolio state [skip ci]" || echo "无状态变更"
          git push || echo "Git push skipped"
