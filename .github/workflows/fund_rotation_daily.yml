name: 🌱 场外公募基金轮动策略 (006503) · 每日 14:48 实盘决策与全渠道提醒

on:
  schedule:
    # 提前预热：每个交易日北京时间 14:25 (UTC 06:25)
    - cron: '25 6 * * 1-5'

  # 支持在 GitHub 网页上一键手动点击运行测试
  workflow_dispatch:
    inputs:
      skip_wait:
        description: '是否跳过等待立即执行 (true/false)'
        required: false
        default: 'false'
        type: boolean

jobs:
  run-fund-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 检出策略代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境 (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 安装核心依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⏳ 毫秒级准点对齐 (等待至北京时间 14:48:00)
        if: "${{ github.event_name == 'schedule' || !inputs.skip_wait }}"
        run: |
          python precision_scheduler.py --target 14:48

      - name: 执行 006503 盘中实时估值与量化信号研判
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python fund_rotation_notifier.py
