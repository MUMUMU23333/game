name: 👑 科创-银行轮动ETF策略 (DTB-Apex 黄金增强旗舰版) · 每日实盘监控与企业微信推送

on:
  # 仅保留早盘 09:20 预热 ➔ 09:35 水温监控 (尾盘 14:48 由 Master 总线统一调度)
  schedule:
    - cron: '20 1 * * 1-5'

  # 支持在 GitHub 网页上一键手动点击运行测试
  workflow_dispatch:
    inputs:
      skip_wait:
        description: '是否跳过等待立即执行 (true/false)'
        required: false
        default: 'false'
        type: boolean

jobs:
  run-star-bank-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 检出策略代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境 (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: 安装量化核心依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⏳ 毫秒级准点对齐 (早盘 09:35 或 尾盘 14:48)
        if: "${{ github.event_name == 'schedule' || !inputs.skip_wait }}"
        run: |
          python -c "
          from precision_scheduler import wait_until_target_beijing_time, get_beijing_now
          now = get_beijing_now()
          if now.hour < 12:
              wait_until_target_beijing_time(9, 35)
          else:
              wait_until_target_beijing_time(14, 48)
          "

      - name: 运行 科创-银行轮动ETF策略 信号引擎并推送企业微信
        env:
          CHINEXT_BANK_WEBHOOK: ${{ secrets.CHINEXT_BANK_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          python chinext_bank_strategy_notifier.py --push
